name: publish-image

on:
  workflow_dispatch:
  release:
    types: published

jobs:
  publish:
    uses: wittdennis/pipelines/.github/workflows/container-image-publish.yaml@a575c9b6835f8dbfd7127f93c1c1e4d588eb7d7d # 2.0.48
    permissions:
      contents: read
      packages: write
    with:
      image-name: homeassistant-otbr
      registries: |
        docker.io
        ghcr.io
      registry-namespaces: |
        denniswitt
        wittdennis
      arm64-build-args: |
        ARCH=aarch64
    secrets:
      registry-passwords: |
        ${{ secrets.DOCKER_REGISTRY_TOKEN }}
        ${{ secrets.GITHUB_TOKEN }}
