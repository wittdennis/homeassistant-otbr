name: publish-image

on:
  workflow_dispatch:
  release:
    types: published

jobs:
  publish:
    uses: wittdennis/pipelines/.github/workflows/container-image-publish.yaml@55a4ef8250a05ec5e8d43a3f0fb6050af4ddec3b # 2.0.70
    permissions:
      contents: read
      packages: write
    with:
      image-name: homeassistant-otbr
      registries: |
        docker.io
        ghcr.io
      registry-namespaces: |
        denniswitt
        wittdennis
      arm64-build-args: |
        ARCH=aarch64
    secrets:
      registry-passwords: |
        ${{ secrets.DOCKER_REGISTRY_TOKEN }}
        ${{ secrets.GITHUB_TOKEN }}
