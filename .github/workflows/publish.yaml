name: publish-image

on:
  workflow_dispatch:
  release:
    types: published

jobs:
  publish:
    uses: wittdennis/pipelines/.github/workflows/container-image-publish.yaml@fb06128e939b3c347883b4a369d4bba39011ce0b # 2.0.60
    permissions:
      contents: read
      packages: write
    with:
      image-name: homeassistant-otbr
      registries: |
        docker.io
        ghcr.io
      registry-namespaces: |
        denniswitt
        wittdennis
      arm64-build-args: |
        ARCH=aarch64
    secrets:
      registry-passwords: |
        ${{ secrets.DOCKER_REGISTRY_TOKEN }}
        ${{ secrets.GITHUB_TOKEN }}
